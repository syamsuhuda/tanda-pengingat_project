name: Daily Attendance Reminder Cron

on:
  schedule:
    # Backup scheduler 1x per jam di menit ke-17 (hemat kuota repo private, tidak bertabrakan dengan cron-job.org 5 menit)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Tahap pengingat absen (auto mengikuti jam di dashboard)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - afternoon
          - urgent

concurrency:
  group: attendance-cron-${{ github.event.inputs.stage || 'auto' }}
  cancel-in-progress: false

jobs:
  trigger-attendance:
    name: Trigger Attendance API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve attendance stage
        id: stage
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STAGE: ${{ github.event.inputs.stage }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_STAGE" ]; then
            STAGE="$INPUT_STAGE"
          else
            STAGE="auto"
          fi

          echo "Resolved stage: $STAGE"
          echo "value=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Call attendance cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STAGE: ${{ steps.stage.outputs.value }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Error: APP_URL dan CRON_SECRET wajib dikonfigurasi di GitHub Repository Secrets." >&2
            exit 1
          fi

          TARGET_URL="${APP_URL%/}/api/cron/attendance"
          echo "POST $TARGET_URL (stage=$STAGE)"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 25 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            -X POST "$TARGET_URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"stage\":\"${STAGE}\",\"source\":\"github-actions\"}"
          echo ""
